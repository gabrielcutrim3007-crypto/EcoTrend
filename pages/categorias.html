<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - EcoVida</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <a href="../index.html" class="voltar">← Voltar para Loja</a>

    <div class="container my-5">

        <div class="row">

            <!-- FILTROS -->
            <aside class="col-md-3">

                <h4 class="mb-3">Filtros</h4>

                <div class="mb-4">
                    <label class="form-label">Preço</label>
                    <input type="range" class="form-range">
                </div>

                <div class="mb-4">
                    <label class="form-label">Categoria</label>
                    <select id="select-categoria" class="form-select">
                        <option value="todos">Todos</option>
                        <option value="roupas">Roupas</option>
                        <option value="beleza">Beleza</option>
                        <option value="casa">Casa</option>
                        <option value="eletronicos">Eletrônicos</option>
                        <option value="garrafas">Garrafas</option>
                        <option value="sabonetes">Sabonetes</option>
                    </select>
                    <button class="btn btn-success mt-2" onclick="aplicarFiltro()">Filtrar</button>
                </div>

            </aside>

            <!-- PRODUTOS -->
            <section class="col-md-9">

                <div class="produtos-grid">

                    <!-- Produto 1 -->
                    <div class="card" data-categoria="roupas">
                        <img src="../imgs/roupa_sustentavel.jpg" class="card-img-top" alt="Roupas Sustentáveis">
                        <div class="card-body">
                            <h5 class="card-title">Roupas Sustentáveis</h5>
                            <p class="verde">R$ 89,90</p>
                            <button class="btn btn-success" onclick="adicionarCarrinho('Roupas Sustentáveis', 89.90)">Adicionar ao carrinho</button>
                        </div>
                    </div>

                    <!-- Produto 2 -->
                    <div class="card" data-categoria="beleza">
                        <img src="../imgs/beleza.webp" class="card-img-top" alt="Produtos de beleza">
                        <div class="card-body">
                            <h5 class="card-title">Produtos de beleza</h5>
                            <p class="verde">R$ 50,00</p>
                            <button class="btn btn-success" onclick="adicionarCarrinho('Produtos de beleza', 50.00)">Adicionar ao carrinho</button>
                        </div>
                    </div>

                    <!-- Produto 3 -->
                    <div class="card" data-categoria="casa">
                        <img src="../imgs/produtos_casa.jpg" class="card-img-top" alt="Utensílios de Cozinha">
                        <div class="card-body">
                            <h5 class="card-title">Utensílios de Cozinha</h5>
                            <p class="verde">R$ 109,99</p>
                            <button class="btn btn-success" onclick="adicionarCarrinho('Utensílios de Cozinha', 109.99)">Adicionar ao carrinho</button>
                        </div>
                    </div>

                    <!-- Produto 4 -->
                    <div class="card" data-categoria="garrafas">
                        <img src="../imgs/garrafas_sustentaveis.avif" class="card-img-top" alt="Garrafas Sustentáveis">
                        <div class="card-body">
                            <h5 class="card-title">Garrafas Sustentáveis</h5>
                            <p class="verde">R$ 39,99</p>
                            <button class="btn btn-success" onclick="adicionarCarrinho('Garrafas Sustentáveis', 39.99)">Adicionar ao carrinho</button>
                        </div>
                    </div>

                    <!-- Produto 5 -->
                    <div class="card" data-categoria="eletronicos">
                        <img src="../imgs/garregador_solar.webp" class="card-img-top" alt="Eletrônicos Sustentáveis">
                        <div class="card-body">
                            <h5 class="card-title">Eletrônicos Sustentáveis</h5>
                            <p class="verde">R$ 129,99</p>
                            <button class="btn btn-success" onclick="adicionarCarrinho('Eletrônicos Sustentáveis', 129.99)">Adicionar ao carrinho</button>
                        </div>
                    </div>

                    <!-- Produto 6 -->
                    <div class="card" data-categoria="sabonetes">
                        <img src="../imgs/sabonete.jpg" class="card-img-top" alt="Sabonetes Naturais">
                        <div class="card-body">
                            <h5 class="card-title">Sabonetes Naturais</h5>
                            <p class="verde">R$ 19,90</p>
                            <button class="btn btn-success" onclick="adicionarCarrinho('Sabonetes Naturais', 19.90)">Adicionar ao carrinho</button>
                        </div>
                    </div>

                </div>

            </section>

        </div>

    </div>

    <!-- Carrinho Sidebar -->
    <div id="carrinho" class="carrinho-sidebar">
        <h3>Carrinho de Compras</h3>
        <ul id="itens-carrinho"></ul>
        <p id="total">Total: R$ 0,00</p>
        <button class="btn btn-danger" onclick="esvaziarCarrinho()">Esvaziar Carrinho</button>
        <button class="btn btn-secondary" onclick="fecharCarrinho()">Fechar</button>
    </div>

    <button id="abrir-carrinho" class="btn btn-success" onclick="abrirCarrinho()">
        <i class="fa-solid fa-cart-shopping"></i> Carrinho
    </button>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script do carrinho -->
    <script src="../js/script.js"></script>

</body>
</html>
